<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cell Spec Lab</title><link rel="stylesheet" href="/src/style.css"><body><header><b>◈ CELL SPEC LAB</b><span>파우치 셀 제조 스펙 · 가상 모델 v0.4</span><button id="save">JSON 저장</button><label class="button">불러오기<input id="load" type="file" accept=".json" hidden></label></header><main><aside><h2>공정과 설계</h2><select id="stage"><option value="S1">01 탭 용접 · 테이프 부착 후</option><option value="S2">02 패키징 후</option><option value="S3" selected>03 완제품</option></select><p class="muted">Stack 직후 단계 제외 · 모든 치수 mm</p><div id="fields"></div><h3>부품 표시</h3><div id="parts"></div><h3>장면 설명</h3><textarea id="notes"></textarea></aside><section id="viewer"><nav><button data-view="front">앞면</button><button data-view="back">뒷면</button><button data-view="side">측면</button><button data-view="iso">전체 보기</button><button id="focus">선택 부품 집중</button></nav><div id="viewport"></div><div class="hint">드래그 회전 · 휠 확대 · 오른쪽 드래그 이동<br>X 길이 / Y 폭 / Z 두께 · 몸체 중심 원점</div><div id="status" role="status">부품을 클릭하면 이름을 확인합니다.</div></section><aside class="right"><h2>측정 관리 <small id="count"></small></h2><p class="muted">직선 거리와 축 투영을 구분합니다. 두께는 대응 면 기준을 확인하세요.</p><input id="name" placeholder="치수 이름 (예: 셀 폭)"><input id="group" placeholder="그룹 (예: 외형)"><select id="axis"><option value="distance">두 점 직선 거리</option><option value="x">X 길이 투영</option><option value="y">Y 폭 투영</option><option value="z">Z 두께 투영</option></select><label>선택 방식<select id="pickmode"><option value="snap">면 중심 스냅</option><option value="free">표면 자유 점</option></select></label><button id="pick">두 기준점 선택 시작</button><button id="width">몸체 폭 예시 추가</button><p id="pending" class="muted"></p><div class="row"><button id="all">전체 켜기</button><button id="none">전체 끄기</button></div><input id="filter" placeholder="이름 / 그룹 / 부품 검색"><div id="measurements"></div></aside></main><script type="module" src="/src/main.js"></script></body></html>
